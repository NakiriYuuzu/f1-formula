# FORMULA NOVA 25 matchmaking (signalling) Worker — deploy steps in README.md
name = "formula-nova-signal"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[vars]
# comma-separated origins allowed to create and join rooms (empty = any): scheme + host [+ port], no path.
# The game is served from github.yuuzu.net (GitHub Pages custom domain; https not enforced, so http too).
ALLOWED_ORIGINS = "https://github.yuuzu.net,http://github.yuuzu.net"
# TURN relay (GET /turn, server/turn/README.md): comma-separated turn: URLs of the coturn server, e.g.
# "turn:203.0.113.7:3478?transport=udp,turn:203.0.113.7:3478?transport=tcp". Empty = no relay. The shared secret is
# not here: `bunx wrangler secret put TURN_SECRET` (the same value as coturn's static-auth-secret).
TURN_URLS = ""
