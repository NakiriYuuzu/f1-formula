# FORMULA NOVA 25 matchmaking (signalling) Worker — deploy steps in README.md
name = "formula-nova-signal"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[vars]
# comma-separated origins allowed to create and join rooms (empty = any): scheme + host [+ port], no path.
# The game is served from github.yuuzu.net (GitHub Pages custom domain; https not enforced, so http too).
ALLOWED_ORIGINS = "https://github.yuuzu.net,http://github.yuuzu.net"
